# =============================================================================
# whoami — EXAMPLE values (generic / shareable)
# Rendered through the `common` library chart (see charts/common).
#
# Self-documenting EXAMPLE with example.com placeholders. The real deployment
# config lives in apps/whoami/values.yaml. whoami is a tiny HTTP echo service
# (traefik/whoami) used to smoke-test ingress / TLS / Authentik forward-auth —
# pure core workload, no secrets/config/storage, so NOTHING lives in post-install.
# =============================================================================
name: whoami
namespace: default

image:
  repository: traefik/whoami
  # renovate: datasource=docker depName=traefik/whoami
  tag: v1.12.0
  pullPolicy: IfNotPresent

controller:
  type: daemonset
  revisionHistoryLimit: 2
  # DaemonSet uses `updateStrategy` (not the Deployment's `strategy`), and only
  # maxUnavailable applies — it's pinned one pod per node, so there is no surge.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

serviceAccount:
  create: false
  secrets: []
  tokenSecret:
    create: false

# Fully non-root, RuntimeDefault seccomp; fsGroup pins group ownership.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  fsGroup: 1000

# Read-only rootfs; drop all caps, add back only NET_BIND_SERVICE so the app can
# bind :80 as an unprivileged user. Writable paths are the three emptyDirs below.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]

# Off: a DaemonSet already schedules exactly one pod per node, so host-topology
# pod anti-affinity is redundant.
podAntiAffinity: false

ports:
  - containerPort: 80
    name: http
    protocol: TCP

# No configuration surface at all — whoami just echoes the request.
envFromConfigMap: ""
envFromSecrets: []
env: []
configMaps: []
externalSecrets: []

resources:
  requests:
    memory: 64Mi
    cpu: 50m
  # cpu limit intentionally absent: a CPU limit is a CFS quota per 100ms period,
  # so it throttles bursty work whose average sits far below the cap. The cpu
  # request in this block is what allocates CPU under contention (cpu.shares).
  limits:
    memory: 128Mi

readinessProbe:
  httpGet:
    path: /health
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 5

livenessProbe:
  httpGet:
    path: /health
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 5

initContainers: []
extraContainers: []

# Three emptyDirs make the read-only rootfs workable (cache / run / tmp).
volumeMounts:
  - name: whoami-cache
    mountPath: /var/cache/whoami
  - name: whoami-run
    mountPath: /var/run
  - name: whoami-tmp
    mountPath: /tmp

volumes:
  - name: whoami-cache
    emptyDir: {}
  - name: whoami-run
    emptyDir: {}
  - name: whoami-tmp
    emptyDir: {}

persistentVolumes: []
persistentVolumeClaims: []

services:
  - name: whoami
    enabled: true
    type: ClusterIP
    ports:
      - name: http
        port: 80
        targetPort: 80

# One host, behind Authentik + default-headers (the common default — `middlewares`
# is omitted, so the standard pair is applied).
ingressRoute:
  enabled: true
  ingressClassName: traefik-external
  entryPoint: websecure
  tlsSecretName: example-com-tls
  routes:
    - host: whoami.example.com
      port: 80

serviceMonitor:
  enabled: false
  labels: {}
  endpoints: []

extraLabels: {}

# -----------------------------------------------------------------------------
# Library capabilities this app does not use (declared for completeness).
# -----------------------------------------------------------------------------
volumeClaimTemplates: []
jobs: []
cronJobs: []
database: {}
middlewares: []
