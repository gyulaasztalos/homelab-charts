apiVersion: v2
name: paperless-ngx
description: Paperless-ngx document management — StatefulSet-backed for its precious RWO Longhorn data (documents + search index), with an NFS RWX consume/export share; CNPG Postgres, Authentik OIDC, Redis.
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/paperless-ngx.svg
type: application
version: 0.1.0
# NOTE: no appVersion here on purpose. The deployed app version is the container
# image tag in values.yaml (image.tag), which is the single source of truth and is
# kept current by Renovate. Duplicating it as appVersion would only risk drift.
# Floor tracks common's current version (>= 0.6.0); the whole repo moves
# together on a bump. See PLAN.md "common versioning".
dependencies:
  - name: common
    version: ">= 0.6.0"
    repository: "file://../common"
