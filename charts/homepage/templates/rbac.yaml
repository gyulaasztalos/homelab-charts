{{- /*
homepage escape-hatch template: the ClusterRole + ClusterRoleBinding granting the
homepage ServiceAccount read access to the cluster resources its Kubernetes
dashboard widgets query (namespaces / pods / nodes / ingresses / ingressroutes /
httproutes / metrics). Cluster-scoped RBAC isn't modelled in `common` (N=1), so it
lives here as a per-chart template. The ServiceAccount + its long-lived token
Secret are rendered by `common` (serviceAccount); this binds to it.
*/ -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "common.name" . }}
  labels:
{{ include "common.labels" . | indent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, nodes]
    verbs: [get, list]
  - apiGroups: [extensions, networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: [traefik.io]
    resources: [ingressroutes]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, gateways]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "common.name" . }}
  labels:
{{ include "common.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "common.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "common.name" . }}
    namespace: {{ include "common.namespace" . }}
