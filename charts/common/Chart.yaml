apiVersion: v2
name: common
description: >-
  HomeLab library chart. Named templates for the standard resource set (deployment/statefulset/daemonset, service, Traefik IngressRoute, Prometheus ServiceMonitor, PVC, ExternalSecret, ConfigMap) encoding homelab conventions.
icon: https://helm.sh/img/helm.svg
type: library
# 0.6.1 — render-time guard `common.assertNoRwoSurge`: a Deployment mounting a
#         ReadWriteOnce PVC under RollingUpdate with maxSurge>0 now FAILS the render
#         (that combination hangs the rollout forever — the replacement pod can't
#         attach the volume the outgoing pod still holds). The failure names the
#         escapes: Recreate, maxSurge:0, or controller.type statefulset. No new
#         values key (patch); pinned by tests/test-toggles.sh. Additive: no current
#         chart trips it (every RWO-PVC app is already a StatefulSet).
# 0.6.0 — common gains `jobs:` (batch/v1 Job), `cronJobs:` (batch/v1 CronJob) and
#         `database:` (CNPG postgresql.cnpg.io/v1 Database) contracts. jobs/cronJobs
#         share one pod-body helper (common.jobPodSpec); a job's image defaults to
#         the app image, so migrate/maintenance Jobs track the deployment tag
#         automatically. Optional argocd hook passthrough. `database` renders the
#         app's mandatory CNPG database (values-driven `namespace`, default
#         databases) — a cross-namespace object that nonetheless belongs with the
#         app. `middlewares` renders the app's Traefik Middleware objects (verbatim
#         spec, values-driven `namespace`, default traefik) — the other half of the
#         edge the IngressRoute already models, so route + middleware sync as a unit.
#         Added to pull mandatory app resources out of post-install: after 0.6.0 a
#         post-install/ dir holds only dashboards and PrometheusRules. Purely
#         additive: an app that sets none renders exactly as before.
# 0.5.0 — common.service gains optional `loadBalancerIP` + `externalTrafficPolicy`
#         (standard Service fields; needed for transmission's MetalLB peer LBs).
# 0.4.0 — ingressRoute.routes[] gains `pathPrefix` (match becomes
#         Host(`…`) && PathPrefix(`…`)), AND fixes middleware defaulting:
#         `middlewares: []` now really renders none. Helm's `default` treats an
#         empty list as empty, so the documented "set [] to drop auth" silently
#         injected authentik instead. Added for apprise's machine-facing routes.
# 0.3.0 — podSpec gains `extraContainers` (sidecars appended after the main
#         container, passed through verbatim). Added for unbound's exporter.
# 0.2.0 — serviceAccount gains an optional `secrets:` back-reference and an
#         optional long-lived `tokenSecret` (kubernetes.io/service-account-token).
version: 0.6.1
maintainers:
  - name: gyulaasztalos
